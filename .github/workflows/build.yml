name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          # Install required SDK components + NDK + CMake
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1" \
            2>/dev/null || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK with debug key
        run: |
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            keytool -genkey -v -keystore $HOME/debug.keystore -alias debug \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=MedGPT, O=MedGPT, C=US"
            
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
              --ks $HOME/debug.keystore \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out ${{ github.workspace }}/MedGPT.apk \
              app/build/outputs/apk/release/app-release-unsigned.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MedGPT-APK
          path: MedGPT.apk
          if-no-files-found: warn

      - name: Upload APK as Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: MedGPT.apk
