name: Build Android APK + AAB

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1" \
            2>/dev/null || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build APK + AAB
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Sign & Prepare APK
        run: |
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            keytool -genkey -v -keystore $HOME/debug.keystore -alias debug \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=MedVision AI, O=MedVision AI, C=US"
            
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
              --ks $HOME/debug.keystore \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out ${{ github.workspace }}/MedVisionAI.apk \
              app/build/outputs/apk/release/app-release-unsigned.apk
          fi

      - name: Sign & Prepare AAB
        run: |
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab ${{ github.workspace }}/MedVisionAI.aab
            jarsigner -keystore $HOME/debug.keystore -storepass android \
              -keypass android -digestalg SHA-256 -sigalg SHA256withRSA \
              ${{ github.workspace }}/MedVisionAI.aab debug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MedVisionAI-APK
          path: MedVisionAI.apk
          if-no-files-found: warn

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: MedVisionAI-AAB
          path: MedVisionAI.aab
          if-no-files-found: warn

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            MedVisionAI.apk
            MedVisionAI.aab
